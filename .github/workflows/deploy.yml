name: Build and Deploy

# main에 push될 때마다 자동 실행 (수동 실행도 가능)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드 (dist/ 생성)
        run: npm run build

      # dist/ 결과물을 angels-fab.github.io 저장소의 main으로 push = 배포
      - name: angels-fab.github.io 로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: angels-fab/angels-fab.github.io
          publish_branch: main
          publish_dir: ./dist
          # 빌드 결과로 통째 교체. .nojekyll은 자동 추가됨.
          # legacy.html·favicon.png은 public/에 있어 dist에 항상 포함됨.
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      # angels-fab.github.io는 레거시(브랜치) Pages 빌드라 발행 단계가 간헐적으로 어긋난다.
      #
      # 2026-08-06 사고: 빌드가 'errored'가 아니라 **'building'에서 9시간 멈췄다**.
      # 옛 판정은 errored만 재요청하고 building은 마냥 기다렸다가 warning 한 줄로 끝냈다 —
      # 그래서 Actions는 초록불인데 사이트는 옛 버전 그대로였고, 사람이 알아채기까지 반나절이 걸렸다.
      # 그때 고친 방법(빌드 재요청 한 번)을 여기 자동화한다.
      #
      # 바뀐 점 셋:
      #  ① 멈춤도 실패로 본다 — 일정 시간 넘게 building/queued면 재요청.
      #  ② '빌드 끝'이 아니라 **'우리 커밋이 발행됐는지'**로 판정한다. 옛 빌드가 built로 남아 있어도 속지 않는다.
      #  ③ 끝내 확정 못 하면 **초록불로 끝내지 않는다**(exit 1) — 조용한 성공이 이 사고의 본질이었다.
      - name: Pages 발행 확인 (멈춤·실패 자동 재요청)
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -u
          REPO=angels-fab/angels-fab.github.io
          # 방금 올린 배포 커밋 — 이 커밋이 발행될 때까지가 '배포 완료'다
          WANT=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "발행 대상 커밋: ${WANT:0:7}"

          STALL=0          # 종료되지 않은 상태로 머문 시간(초)
          STALL_LIMIT=90   # 이만큼 안 끝나면 멈춘 것으로 보고 재요청
          RETRIES=0
          MAX_RETRIES=3

          sleep 25 # push 후 새 빌드가 큐에 잡히도록 대기
          for i in $(seq 1 30); do
            JSON=$(gh api "repos/$REPO/pages/builds/latest" 2>/dev/null || echo '{}')
            STATUS=$(echo "$JSON" | jq -r '.status // "unknown"')
            SHA=$(echo "$JSON" | jq -r '.commit // ""')
            echo "[$i] 상태=$STATUS 커밋=${SHA:0:7} (정체 ${STALL}s · 재요청 ${RETRIES}회)"

            if [ "$STATUS" = "built" ] && [ "$SHA" = "$WANT" ]; then
              echo "✅ 발행 완료 — ${WANT:0:7}"
              exit 0
            fi

            # errored 는 즉시, 그 밖(building·queued·unknown·옛 커밋이 built)은 정체 시간을 쌓아 판단한다.
            # 옛 커밋이 built 인 것은 우리 빌드가 아직 큐에 안 잡힌 정상 상태일 수 있어 곧장 재요청하지 않는다.
            NEED_RETRY=0
            if [ "$STATUS" = "errored" ]; then
              echo "⚠️ 빌드 실패 — 재요청"
              NEED_RETRY=1
            else
              STALL=$((STALL + 20))
              if [ "$STALL" -ge "$STALL_LIMIT" ]; then
                echo "⚠️ ${STALL}초 동안 '$STATUS' 에서 안 끝남 — 멈춘 것으로 보고 재요청"
                NEED_RETRY=1
              fi
            fi

            if [ "$NEED_RETRY" = "1" ]; then
              if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
                echo "::error::Pages 발행이 재요청 ${MAX_RETRIES}회 뒤에도 확정되지 않았습니다. 코드는 올라갔고 발행만 남았습니다. 수동 재요청: gh api -X POST repos/$REPO/pages/builds"
                exit 1
              fi
              gh api -X POST "repos/$REPO/pages/builds" >/dev/null 2>&1 || true
              RETRIES=$((RETRIES + 1))
              STALL=0
              sleep 30
              continue
            fi
            sleep 20
          done
          echo "::error::Pages 발행이 시간 안에 확정되지 않았습니다. 코드는 올라갔고 발행만 남았습니다. 수동 재요청: gh api -X POST repos/$REPO/pages/builds"
          exit 1
